{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Vetri FinTrack</title>

    <link rel="stylesheet" href="{% static 'css/signup.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="signup-container">

        <!-- Left Side -->

        <div class="signup-left">

            <div class="left-wrapper">

                <h1>Create Account</h1>

                <h2>Signup to get started</h2>

                <form id="signupForm">

                    <div class="form-group">

                        <label>Enter Name *</label>

                        <input type="text" id="name" placeholder="Enter Your Name">

                    </div>

                    <div class="form-group">

                        <label>Phone Number *</label>

                        <input type="tel" id="phone" placeholder="Enter Phone Number">

                    </div>

                    <div class="form-group">

                        <label>Email ID *</label>

                        <input type="email" id="email" placeholder="Enter Email Address">

                    </div>

                    <div class="form-group">

                        <label>Password *</label>

                        <div class="password-box">

                            <input type="password" id="password" placeholder="Enter Password">

                            <i class="fa-regular fa-eye-slash toggle-password"></i>

                        </div>

                    </div>

                    <button type="submit" class="signup-btn">
                        Sign Up
                    </button>

                </form>

                <div class="login-text">

                    Already have an account?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <button class="google-btn">

                    <img src="{% static 'images/googlelogo.jpg' %}" alt="">

                    Continue With Google

                </button>

                <small>
                    By signing up, you agree to our Terms of Service
                    and Privacy Policy.
                </small>

            </div>

        </div>

        <!-- Right Side -->

        <div class="signup-right">

            <div class="logo-wrap">

                <img src="{% static 'images/vetrilogo.png' %}" alt="" class="logo">

            </div>

            <img src="{% static 'images/signupimg.png' %}" alt="" class="main-image">

        </div>

    </div>

    <script>

        const togglePassword =
            document.querySelector('.toggle-password');

        const password =
            document.getElementById('password');

        togglePassword.addEventListener('click', function () {

            if (password.type === 'password') {

                password.type = 'text';

                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');

            } else {

                password.type = 'password';

                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');

            }

        });


        const form =
            document.getElementById('signupForm');

        form.addEventListener('submit', function (e) {

            e.preventDefault();

            const name =
                document.getElementById('name').value.trim();

            const phone =
                document.getElementById('phone').value.trim();

            const email =
                document.getElementById('email').value.trim();

            const password =
                document.getElementById('password').value.trim();


            if (name === '') {
                alert('Please enter your name');
                return;
            }

            if (phone === '') {
                alert('Please enter your phone number');
                return;
            }

            if (!/^\d{10}$/.test(phone)) {
                alert('Phone number must contain 10 digits');
                return;
            }

            if (email === '') {
                alert('Please enter your email address');
                return;
            }

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {
                alert('Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            alert('Account created successfully!');

            window.location.href = "/income-source/";

        });

    </script>

</body>

</html>
