{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Vetri FinTrack</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <div class="login-container">

        <!-- Left Side -->

        <div class="login-left">
            <div class="left-wrapper">

                <h1>
                    Welcome Back
                    <span class="wave">👋</span>
                </h1>

                <h2>Login to your account</h2>

                <form id="loginForm">

                    <div class="form-group">

                        <label>Email ID*</label>

                        <input type="email" id="email" placeholder="Enter Email Address">

                    </div>

                    <div class="form-group">

                        <label>Password*</label>

                        <div class="password-box">

                            <input type="password" id="password" placeholder="Enter Password">

                            <i class="fa-regular fa-eye-slash toggle-password"></i>

                        </div>

                    </div>

                    <a href="#" class="forgot-link">
                        Forgot Password?
                    </a>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                </form>

                <div class="signup-text">

                    Don't have an account?

                    <a href="{% url 'signup' %}">
                        Sign Up
                    </a>

                </div>

                <div class="divider">
                    <span>or</span>
                </div>

                <button class="google-btn">

                    <img src="{% static 'images/googlelogo.jpg' %}" alt="Google">

                    Continue With Google

                </button>

                <small>
                    By logging in, you agree to our Terms of Service and
                    Privacy Policy.
                </small>
            </div>
        </div>


        <!-- Right Side -->

        <div class="login-right">
            <div class="right-wrapper">

                <div class="logo-wrap">

                    <img src="{% static 'images/vetrilogo.png' %}" alt="Logo" class="logo">

                </div>

                <img src="{% static 'images/loginimg.png' %}" alt="Finance Illustration" class="main-image">
            </div>
        </div>

    </div>

    <script>

        /* Password Toggle */

        const togglePassword =
            document.querySelector('.toggle-password');

        const password =
            document.getElementById('password');

        togglePassword.addEventListener('click', () => {

            if (password.type === 'password') {

                password.type = 'text';

                togglePassword.classList.remove('fa-eye-slash');
                togglePassword.classList.add('fa-eye');

            } else {

                password.type = 'password';

                togglePassword.classList.remove('fa-eye');
                togglePassword.classList.add('fa-eye-slash');

            }

        });


        /* Form Validation */

        const form =
            document.getElementById('loginForm');

        form.addEventListener('submit', function (e) {

            e.preventDefault();

            const email =
                document.getElementById('email').value.trim();

            const password =
                document.getElementById('password').value.trim();


            if (email === '') {

                alert('Please enter your email address.');

                return;
            }


            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                alert('Please enter a valid email address.');

                return;
            }


            if (password === '') {

                alert('Please enter your password.');

                return;
            }


            if (password.length < 6) {

                alert('Password must be at least 6 characters.');

                return;
            }


            alert('Login successful!');

            // Redirect to dashboard page

            window.location.href = "/dashboard/";

        });

    </script>

</body>

</html>
